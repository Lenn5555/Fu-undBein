name: KI-Server veröffentlichen

# Veröffentlicht den Cloudflare Worker (KI-Berater und Bestellmail).
# Benötigte GitHub-Secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ANTHROPIC_API_KEY, RESEND_API_KEY,
#   BEZUGSQUELLEN (Inhalt von katalog/intern/ki-bezugsquellen-fuer-github.txt, gzip + base64)
on:
  push:
    branches: [main]
    paths: ["ki/worker/**", ".github/workflows/ki-server.yml"]
  workflow_dispatch:
    inputs:
      testbestellung:
        description: "Testbestellung an die Bestelladresse schicken"
        type: boolean
        default: false
      testsku:
        description: "Artikelnummer für die Testbestellung (leer = erstes Produkt mit Ausführungen)"
        type: string
        default: ""
      paypaltest:
        description: "PayPal-Zugang prüfen (legt eine unbezahlte PayPal-Bestellung an, es wird nichts abgebucht)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ki-server
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ki/worker
    env:
      BEZUGSQUELLEN: ${{ secrets.BEZUGSQUELLEN }}
      HAT_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Bezugsquellen aus dem Secret auspacken (nur für diesen Lauf)
        run: |
          if [ -n "$BEZUGSQUELLEN" ]; then
            echo "$BEZUGSQUELLEN" | base64 -d | gunzip > src/bezugsquellen.json
          else
            echo "::warning::Secret BEZUGSQUELLEN fehlt, Bestellmails enthalten keine Bezugsquelle"
            echo '{}' > src/bezugsquellen.json
          fi
          node -e "console.log(Object.keys(require('./src/bezugsquellen.json')).length + ' Bezugsquellen')"
      - run: npm test
      - name: Worker veröffentlichen
        if: env.HAT_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Sofortbezahlen über PayPal (optional; PAYPAL_SANDBOX = "ja" für die Testumgebung)
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_SECRET: ${{ secrets.PAYPAL_SECRET }}
          PAYPAL_SANDBOX: ${{ secrets.PAYPAL_SANDBOX }}
          # Lagerdatei per Mail (Resend-Webhook und Lese-Schlüssel), siehe src/eingang.js
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          RESEND_LESEN_KEY: ${{ secrets.RESEND_LESEN_KEY }}
        run: |
          npx wrangler deploy
          # Nur vorhandene Schlüssel hochladen; fehlende (z. B. Resend) werden später nachgereicht
          for name in ANTHROPIC_API_KEY RESEND_API_KEY PAYPAL_CLIENT_ID PAYPAL_SECRET PAYPAL_SANDBOX RESEND_WEBHOOK_SECRET RESEND_LESEN_KEY; do
            if [ -n "${!name}" ]; then
              printf '%s' "${!name}" | npx wrangler secret put "$name"
            else
              echo "::warning::Secret $name fehlt noch"
            fi
          done
      - name: Kurztest gegen den echten Berater
        if: env.HAT_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Server-Protokoll mitschneiden, damit Fehlermeldungen der KI im Log stehen
          npx wrangler tail beinundfuss-ki --format pretty > protokoll.txt 2>&1 &
          sleep 12
          curl -sS -m 90 -X POST https://beinundfuss-ki.beinundfuss.workers.dev/beraten \
            -H "Origin: https://xn--beinundfu-o1a.de" -H "Content-Type: application/json" \
            -d '{"verlauf":[{"rolle":"kunde","text":"Ich brauche 4 Stellfüße M12 für eine Maschine mit 400 kg, der Boden ist etwas uneben."}]}' \
            -o antwort.json -w "HTTP %{http_code} in %{time_total}s\n"
          node -e "const d=require('./antwort.json'); console.log(d.antwort||d.fehler); for (const p of d.produkte||[]) console.log('-', p.sku, p.name, p.preis)"
          sleep 3; echo "--- Server-Protokoll ---"; grep -v -i "key" protokoll.txt | tail -20 || true
          node -e "const d=require('./antwort.json'); process.exit(d.antwort ? 0 : 1)"
      - name: Testbestellung (nur auf Wunsch beim manuellen Start)
        if: env.HAT_TOKEN == 'true' && inputs.testbestellung
        env:
          TESTSKU: ${{ inputs.testsku }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e "
            const kat = require('./src/katalog.json');
            const k = (process.env.TESTSKU && kat.find((p) => p.sku === process.env.TESTSKU)) || kat.find((p) => p.varianten.length);
            console.log(JSON.stringify({ sku: k.sku, variante: k.varianten.length ? k.varianten[0].sku : undefined, menge: 4, firma: 'TEST',
              name: 'Testbestellung, bitte ignorieren', email: 'sales@ts-systec.de', strasse: 'Teststraße 1', zusatz: 'Test, keine Lieferung', plz: '64319', ort: 'Pfungstadt',
              hinweis: 'Automatischer Test der Bestellmail. Bitte nicht bearbeiten.', zustimmung: true }));
          " > bestellung.json
          npx wrangler tail beinundfuss-ki --format json > bestell-protokoll.txt 2>&1 &
          sleep 12
          curl -sS -m 60 -X POST https://beinundfuss-ki.beinundfuss.workers.dev/bestellen \
            -H "Origin: https://xn--beinundfu-o1a.de" -H "Content-Type: application/json" \
            --data @bestellung.json -o ergebnis.json -w "HTTP %{http_code}\n"
          cat ergebnis.json; echo
          sleep 4; echo "--- Server-Protokoll ---"; node -e "const t=require('fs').readFileSync('bestell-protokoll.txt','utf8'); for (const m of t.matchAll(/\"(message|outcome|name)\":\s*(\[[\s\S]*?\]|\"[^\"]*\")/g)) { const z=m[0].replace(/\s+/g,' '); if (!/key|secret|bearer/i.test(z)) console.log(z); }" || true
          echo "--- Fehlermeldungen ---"; grep -A3 '"message": \[' bestell-protokoll.txt | sed -E 's/re_[A-Za-z0-9_]+/re_***/g' | grep -v -i "bearer\|authorization" || true
          node -e "process.exit(require('./ergebnis.json').ok ? 0 : 1)"
      - name: PayPal-Zugang prüfen (nur auf Wunsch beim manuellen Start)
        if: env.HAT_TOKEN == 'true' && inputs.paypaltest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler tail beinundfuss-ki --format pretty > paypal-protokoll.txt 2>&1 &
          sleep 12
          curl -sS -m 30 https://beinundfuss-ki.beinundfuss.workers.dev/bezahlen -H "Origin: https://xn--beinundfu-o1a.de" \
            | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const d=JSON.parse(s);console.log('aktiv:',d.aktiv,'sandbox:',d.sandbox)})"
          node -e "
            const k = require('./src/katalog.json').find((p) => p.varianten.length && !p.preis_ab);
            console.log(JSON.stringify({ sku: k.sku, variante: k.varianten[0].sku, menge: 1, firma: 'TEST',
              name: 'PayPal-Test', email: 'sales@ts-systec.de', strasse: 'Teststraße 1', plz: '64319', ort: 'Pfungstadt',
              zahlart: 'PayPal', zustimmung: true }));
          " > zahlung.json
          curl -sS -m 60 -X POST https://beinundfuss-ki.beinundfuss.workers.dev/bezahlen/start \
            -H "Origin: https://xn--beinundfu-o1a.de" -H "Content-Type: application/json" \
            --data @zahlung.json -o start.json -w "HTTP %{http_code}\n"
          sleep 4; echo "--- Server-Protokoll ---"; grep -v -i "key\|secret\|bearer\|basic" paypal-protokoll.txt | tail -20 || true
          node -e "const d=require('./start.json'); console.log(d.ok ? 'PayPal-Bestellung angelegt, Betrag ' + d.gesamt : 'Fehler: ' + d.fehler); process.exit(d.ok ? 0 : 1)"
      - name: Hinweis
        if: env.HAT_TOKEN != 'true'
        run: echo "::notice::Noch kein CLOUDFLARE_API_TOKEN hinterlegt, Worker wurde nur getestet."
