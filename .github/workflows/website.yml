name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Ohne eigene Domain (Datei CNAME) liegt die Seite unter lenn5555.github.io/Fu-undBein/
      - run: python3 werkzeuge/build_site.py
        env:
          SITE_BASIS: ${{ hashFiles('CNAME') == '' && '/Fu-undBein' || '' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
