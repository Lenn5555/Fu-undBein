name: Mailtest Outlook
# Einmaliger Test: welche Mail-Variante zeigt Outlook am PC an? Danach wieder löschen.
on: workflow_dispatch
jobs:
  senden:
    runs-on: ubuntu-latest
    steps:
      - name: Drei Testmails an die Bestelladresse
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          absender = "Bein und Fuss <bestellung@xn--beinundfu-o1a.de>"
          an = ["sales@ts-systec.de"]
          html = lambda t: '<!DOCTYPE html><html><head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"></head><body><p style="font-family:Arial">' + t + '</p></body></html>'
          mails = [
            {"from": "Mailtest <onboarding@resend.dev>", "to": an, "subject": "Mailtest 4", "text": "Mailtest 4: andere Absenderadresse ohne Umlaut-Domain.", "html": html("Mailtest 4: andere Absenderadresse ohne Umlaut-Domain.")},
          ]
          for m in mails:
              r = urllib.request.Request("https://api.resend.com/emails", data=json.dumps(m).encode(), method="POST",
                  headers={"Authorization": "Bearer " + os.environ["RESEND_API_KEY"], "Content-Type": "application/json", "User-Agent": "beinundfuss-mailtest"})
              try:
                  with urllib.request.urlopen(r) as a:
                      print(m["subject"], a.status)
              except urllib.error.HTTPError as e:
                  print(m["subject"], e.code, e.read().decode()[:300])
          PY
