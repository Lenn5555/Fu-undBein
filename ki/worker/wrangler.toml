# Cloudflare Worker für den KI-Berater von beinundfuß.de
# Veröffentlicht wird über GitHub Actions (.github/workflows/ki-server.yml).
# Geheimnisse NIE hier eintragen, sondern als GitHub-Secrets (siehe README).
name = "beinundfuss-ki"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Seiten, die den Berater aufrufen dürfen (kommagetrennt)
HERKUNFT = "https://lenn5555.github.io,https://xn--beinundfu-o1a.de,https://www.xn--beinundfu-o1a.de"
BESTELL_EMAIL = "sales@ts-systec.de"
# Absender muss bei Resend als Domain bestätigt sein
ABSENDER = "Bein und Fuss <bestellung@xn--beinundfu-o1a.de>"
# SHA-256 des Schlüssels für die Statistikseite; der Schlüssel selbst steht nicht im Repo
STATISTIK_HASH = "8d97d06abe5bb2467539b272c03c85fa0d29f4ad45ae7ccf2e887d04d28233f2"
# SHA-256 des Schlüssels für den Abendbericht (liest /statistik ohne Browser). Leer = kein Zugang.
# Klartext steht nur als Umgebungsvariable BERICHT_SCHLUESSEL in Lenns Cloud-Umgebung, nie im Repo.
BERICHT_HASH = ""

# Anonyme Besucherzählung (Tagessummen, keine Cookies, keine IP), siehe src/statistik.js
[[durable_objects.bindings]]
name = "ZAEHLER"
class_name = "Zaehler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Zaehler"]

# Schutz gegen Missbrauch: höchstens 20 Anfragen pro Minute und Besucher
[[ratelimits]]
name = "BREMSE"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
