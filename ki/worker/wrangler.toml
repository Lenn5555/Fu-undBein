# Cloudflare Worker für den KI-Berater von beinundfuß.de
# Veröffentlicht wird über GitHub Actions (.github/workflows/ki-server.yml).
# Geheimnisse NIE hier eintragen, sondern als GitHub-Secrets (siehe README).
name = "beinundfuss-ki"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Seiten, die den Berater aufrufen dürfen (kommagetrennt)
HERKUNFT = "https://lenn5555.github.io,https://xn--beinundfu-o1a.de,https://www.xn--beinundfu-o1a.de"
BESTELL_EMAIL = "sales@ts-systec.de"
# Absender muss bei Resend als Domain bestätigt sein
ABSENDER = "beinundfuß.de <bestellung@xn--beinundfu-o1a.de>"

# Schutz gegen Missbrauch: höchstens 20 Anfragen pro Minute und Besucher
[[ratelimits]]
name = "BREMSE"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
